name: Build AilinTouch IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install ldid
        run: brew install ldid

      - name: Build + Sign + Package
        run: |
          make all

      - name: Verify entitlements
        run: |
          ldid -e build/AilinTouch.app/AilinTouch | grep -q "event-dispatch" && echo "OK: event-dispatch present" || (echo "FAIL: missing event-dispatch"; exit 1)

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AilinTouch-IPA
          path: build/AilinTouch.ipa
          retention-days: 30
